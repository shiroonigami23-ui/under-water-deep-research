name: Fetch open-access papers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths: ["site_src/data/papers.json"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download openly licensed PDFs
        run: python scripts/fetch_papers.py
      - name: Commit new PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/papers
          git diff --cached --quiet || (git commit -m "Mirror open-access paper PDFs" && git push)
