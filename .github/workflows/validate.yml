name: Validate research hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Regenerate hub figures (smoke test)
        run: python scripts/generate_figures.py
      - name: Check Markdown links and images
        run: python scripts/check_links.py
